services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ivm-client
    depends_on:
      - server
    restart: on-failure
    ports:
      - "5176:5175"
    volumes:
      - ./client/src:/code/src
      - ./client/public:/code/public
    networks:
      - ivm-network
    environment:
      - VITE_PORT_NUMBER=5175
      - VITE_API_BASE_URL=http://localhost:5692

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ivm-server
    depends_on:
      - mongo
    restart: on-failure
    ports:
      - "5692:5000"
    volumes:
      - ./server/src:/code/src
      - ./server/types:/code/types
    networks:
      - ivm-network
    environment:
      - ENVIRONMENT=development
      - PORT=5000
      - CORS_ORIGIN=http://localhost:5176
      - MONGO_URI=mongodb://admin:password@mongo:27017
      - DB_NAME=inv-db
      - JWT_SECRET=top-secret-key

  mongo:
    image: mongo
    container_name: ivm-mongo
    restart: unless-stopped
    ports:
      - "27023:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./.data/mongo_data:/data/db
      - ./.data/mongo_config:/data/configdb
    networks:
      - ivm-network

networks:
  ivm-network:
    driver: bridge
